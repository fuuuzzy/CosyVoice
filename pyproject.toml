[project]
name = "cosyvoice"
version = "3.0.0"
description = "CosyVoice - Text-to-Speech Large Language Model"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "FunAudioLLM Team" }
]
keywords = ["tts", "speech-synthesis", "voice-cloning", "llm", "cosyvoice"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# 核心依赖（所有平台通用）
dependencies = [
    "conformer==0.3.2",
    "diffusers==0.29.0",
    "fastapi==0.115.6",
    "fastapi-cli==0.0.4",
    "gdown==5.1.0",
    "gradio==5.4.0",
    "grpcio==1.57.0",
    "grpcio-tools==1.57.0",
    "hydra-core==1.3.2",
    "HyperPyYAML==1.2.2",
    "inflect==7.3.1",
    "librosa==0.10.2",
    "lightning==2.2.4",
    "matplotlib==3.7.5",
    "modelscope==1.20.0",
    "networkx==3.1",
    "omegaconf==2.3.0",
    "onnx==1.16.0",
    "openai-whisper>=20240930",
    "protobuf==4.25",
    "pyarrow==18.1.0",
    "pydantic==2.7.0",
    "pyworld==0.3.4",
    "rich==13.7.1",
    "soundfile==0.12.1",
    "tensorboard==2.14.0",
    "torch",
    "torchaudio",
    "transformers>=4.46.3",
    "uvicorn==0.30.0",
    "wetext==0.0.4",
    "wget==3.2",
    # 平台特定依赖（使用环境标记自动选择）
    "onnxruntime==1.18.0; sys_platform == 'darwin' or sys_platform == 'win32'",
    "deepspeed==0.15.1; sys_platform == 'linux'",
]

[project.optional-dependencies]
# 开发工具（所有平台）
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "isort>=5.0",
    "flake8>=6.0",
    "mypy>=1.0",
]
#GPU 加速 (Linux)
gpu = [
    "tensorrt-cu12-libs==10.13.3.9; sys_platform == 'linux'",
    "tensorrt-cu12-bindings==10.13.3.9; sys_platform == 'linux'",
    "tensorrt-cu12==10.13.3.9; sys_platform == 'linux'",
    "onnxruntime-gpu==1.18.0; sys_platform == 'linux'",
]
#vLLM 加速 (Linux + GPU)
vllm = [
    "vllm==0.9.0; sys_platform == 'linux'",
    "transformers==4.51.3; sys_platform == 'linux'",
]

[project.urls]
Homepage = "https://github.com/FunAudioLLM/CosyVoice"
Documentation = "https://github.com/FunAudioLLM/CosyVoice/blob/main/README.md"
Repository = "https://github.com/FunAudioLLM/CosyVoice"
Issues = "https://github.com/FunAudioLLM/CosyVoice/issues"

[project.scripts]
cosyvoice-webui = "webui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cosyvoice"]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cuda", marker = "sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cuda", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cuda", marker = "sys_platform == 'linux'" },
]
tensorrt-cu12 = { index = "nvidia" }
tensorrt-cu12-libs = { index = "nvidia" }
tensorrt-cu12-bindings = { index = "nvidia" }

[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  
  | \.venv
  | build
  | dist
  | third_party
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip_gitignore = true
extend_skip_glob = ["third_party/*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "third_party/",
    "build/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
